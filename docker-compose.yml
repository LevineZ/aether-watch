services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aether}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aether}
      POSTGRES_DB: ${POSTGRES_DB:-aetherwatch}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aether} -d ${POSTGRES_DB:-aetherwatch}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  minio:
    build:
      context: ./infra/minio
      dockerfile: Dockerfile
    image: aetherwatch-minio:2024-11-07
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aetherwatch}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aetherwatch_dev}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 8s
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aether}:${POSTGRES_PASSWORD:-aether}@postgres:5432/${POSTGRES_DB:-aetherwatch}?ssl=disable
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-aetherwatch}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-aetherwatch_dev}
      MINIO_BUCKET: ${MINIO_BUCKET:-aetherwatch}
      MINIO_SECURE: "false"
      ADMIN_TOKEN: ${ADMIN_TOKEN:-aether-dev}
      OPEN_METEO_BASE: ${OPEN_METEO_BASE:-https://api.open-meteo.com}
      OPEN_METEO_MARINE_BASE: ${OPEN_METEO_MARINE_BASE:-https://marine-api.open-meteo.com}
      FIELD_NX: ${FIELD_NX:-20}
      FIELD_NY: ${FIELD_NY:-15}
      CURRENT_NX: ${CURRENT_NX:-16}
      CURRENT_NY: ${CURRENT_NY:-8}
      OPEN_METEO_BATCH_SIZE: ${OPEN_METEO_BATCH_SIZE:-40}
      OPEN_METEO_CONCURRENCY: ${OPEN_METEO_CONCURRENCY:-1}
      OPEN_METEO_MAX_RETRIES: ${OPEN_METEO_MAX_RETRIES:-4}
      OPEN_METEO_BACKOFF_BASE: ${OPEN_METEO_BACKOFF_BASE:-1.5}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-21600}
      WIND_CACHE_TTL_SECONDS: ${WIND_CACHE_TTL_SECONDS:-21600}
      CURRENT_CACHE_TTL_SECONDS: ${CURRENT_CACHE_TTL_SECONDS:-21600}
      CATALOG_CACHE_TTL_SECONDS: ${CATALOG_CACHE_TTL_SECONDS:-3600}
      LAST_GOOD_TTL_SECONDS: ${LAST_GOOD_TTL_SECONDS:-604800}
      NEWS_DIR: /content/news
      GEO_DIR: /content/geo
      CONTENT_DIR: /content
    volumes:
      - ./content:/content:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    command: taskiq worker app.workers:broker
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aether}:${POSTGRES_PASSWORD:-aether}@postgres:5432/${POSTGRES_DB:-aetherwatch}?ssl=disable
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-aetherwatch}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-aetherwatch_dev}
      MINIO_BUCKET: ${MINIO_BUCKET:-aetherwatch}
      MINIO_SECURE: "false"
      OPEN_METEO_BASE: ${OPEN_METEO_BASE:-https://api.open-meteo.com}
      OPEN_METEO_MARINE_BASE: ${OPEN_METEO_MARINE_BASE:-https://marine-api.open-meteo.com}
      FIELD_NX: ${FIELD_NX:-20}
      FIELD_NY: ${FIELD_NY:-15}
      CURRENT_NX: ${CURRENT_NX:-16}
      CURRENT_NY: ${CURRENT_NY:-8}
      OPEN_METEO_BATCH_SIZE: ${OPEN_METEO_BATCH_SIZE:-40}
      OPEN_METEO_CONCURRENCY: ${OPEN_METEO_CONCURRENCY:-1}
      OPEN_METEO_MAX_RETRIES: ${OPEN_METEO_MAX_RETRIES:-4}
      OPEN_METEO_BACKOFF_BASE: ${OPEN_METEO_BACKOFF_BASE:-1.5}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-21600}
      WIND_CACHE_TTL_SECONDS: ${WIND_CACHE_TTL_SECONDS:-21600}
      CURRENT_CACHE_TTL_SECONDS: ${CURRENT_CACHE_TTL_SECONDS:-21600}
      CATALOG_CACHE_TTL_SECONDS: ${CATALOG_CACHE_TTL_SECONDS:-3600}
      LAST_GOOD_TTL_SECONDS: ${LAST_GOOD_TTL_SECONDS:-604800}
      NEWS_DIR: /content/news
      GEO_DIR: /content/geo
      CONTENT_DIR: /content
    volumes:
      - ./content:/content:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      NUXT_API_INTERNAL: http://api:8000
      NUXT_PUBLIC_API_BASE: /api
      HOST: 0.0.0.0
      PORT: "3000"
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: "3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 8s
      retries: 12
      start_period: 25s
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    ports:
      - "${AETHERWATCH_PORT:-8765}:80"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
